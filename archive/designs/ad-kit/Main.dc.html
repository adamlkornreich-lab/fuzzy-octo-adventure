<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pirate trivia square ad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&amp;family=Alegreya:wght@400;700&amp;family=Alegreya+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#e0b056}a:hover{color:#f3ead7}
</style>
</helmet>
<div style="width: 1080px; height: 1080px; box-sizing: border-box; background: #0b1a26; color: #f3ead7; font-family: Alegreya, Georgia, serif; position: relative; overflow: hidden; padding: 80px; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; gap: 56px; align-items: flex-start">
<div style="flex: 1; display: flex; flex-direction: column; gap: 28px; padding-top: 12px">
<p style="margin: 0; font-family: 'Alegreya Sans', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.2em; text-transform: uppercase; color: #3fb6a8">Gaspar's Grotto · Ybor City</p>
<h1 style="margin: 0; font-family: 'Pirata One', Georgia, serif; font-weight: 400; font-size: 132px; line-height: 0.92; color: {{accent}}">Pirate trivia, every night</h1>
<p style="margin: 0; font-size: 38px; line-height: 1.3; color: #e6dcc6">Movies, pirate lore and Tampa Bay. Fresh questions daily. How many can you get?</p>
</div>
<img src="/_blob/4fc7630bc01a9b3d993bb6984a96f8fc" alt="Pops and Pippy pirate poster" style="width: 400px; height: 478px; object-fit: cover; border-radius: 18px; border: 4px solid #e0b056; transform: rotate(3deg); margin-top: 24px">
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 16px">
<span style="display: inline-block; align-self: flex-start; background: {{accent}}; color: #1b1305; font-family: 'Alegreya Sans', sans-serif; font-weight: 800; font-size: 40px; padding: 22px 36px; border-radius: 16px">Play free</span>
<span style="font-family: 'Alegreya Sans', sans-serif; font-weight: 700; font-size: 34px; color: #f3ead7">thepiratesofybor.com</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 230px">
<img src="/_blob/a8053dfe81f28d9bb62b27f5dbcd2761" alt="Pops and Pippy watermark" style="width: 120px; height: 123px; opacity: 0.85">
<span style="font-family: 'Alegreya Sans', sans-serif; font-size: 15px; line-height: 1.3; text-align: center; color: #cfc4ad">© 2026 Adam Kornreich / R.A. Consulting ❤ Pops &amp; Pippy</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e0b056","options":["#e0b056","#3fb6a8","#c4572b"]},"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#e0b056' };
  }
}
</script>
</body>
</html>
