<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gaspar's Pour-Off</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Layout: one screen behind the bar. Bartender bug + clock on top, order ticket, the bar (canvas) with the glass and the bottle well, house controls at the foot. Single after-hours look in Gaspar's black, antique gold and oxblood. */
:root{
  --night:#0d0b0a; --wood:#2a1a10; --panel:rgba(18,13,10,.88); --gold:#c9a96a; --gold-hi:#e8cf94; --oxblood:#7c2a22;
  --ink:#f3ead8; --mute:#a99a80; --line:rgba(201,169,106,.4); --ok:#8fd18a; --bad:#ff7a5c;
  --display:"Cinzel","Trajan Pro",Georgia,serif; --ui:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#3a2516 0%,var(--night) 65%);color:var(--ink);font-family:var(--ui);display:flex;flex-direction:column;align-items:center;overflow:hidden;-webkit-user-select:none;user-select:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
.top{width:100%;max-width:520px;display:flex;align-items:center;gap:8px;padding-block:10px 6px}
.who{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 10px 4px 4px;min-width:0}
.who img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:2px solid var(--gold)}
.who b{display:block;font:700 15px var(--display);letter-spacing:.04em;line-height:1}
.who small{font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:700}
.stat{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:10px;text-align:center;padding:4px 2px}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;letter-spacing:.14em;color:var(--mute);font-weight:700}
#clock.low{color:var(--bad)}
#ticket{width:100%;max-width:520px;box-sizing:border-box;background:#efe4cc;color:#2a1d12;border-radius:6px 6px 2px 2px;padding:8px 12px 10px;box-shadow:0 6px 14px rgba(0,0,0,.5);position:relative;margin-bottom:6px;background-image:repeating-linear-gradient(0deg,transparent 0 21px,rgba(124,42,34,.08) 21px 22px)}
#ticket:after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:radial-gradient(circle at 6px 0,#efe4cc 5px,transparent 5.5px) 0 0/12px 6px repeat-x}
.tk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tk-h b{font:900 17px var(--display);letter-spacing:.03em;color:var(--oxblood)}
.tk-h span{font-size:13px;font-weight:700;letter-spacing:.1em;color:#6b5844}
#steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.st{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:700;padding:2px 9px 2px 4px;border-radius:999px;border:1.5px solid #c8b591}
.st i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.3)}
.st.now{border-color:var(--oxblood);background:rgba(124,42,34,.1)}
.st.done{opacity:.55;text-decoration:line-through}
#stage{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-start}
#c{height:100%;max-width:100%;aspect-ratio:2/3;touch-action:none;display:block;border-radius:12px}
.foot{width:100%;max-width:520px;display:flex;gap:6px;align-items:center;padding-block:6px calc(env(safe-area-inset-bottom,0px) + 10px)}
.foot .sp{flex:1}
.foot button{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:38px;padding:0 12px;font-weight:700;letter-spacing:.08em;font-size:14px}
#dump{color:var(--bad)}
.foot button[aria-pressed="false"]{opacity:.45}
#call{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.7);font:900 30px var(--display);color:var(--gold-hi);text-shadow:0 3px 0 #000,0 0 22px rgba(201,169,106,.5);opacity:0;transition:all .3s cubic-bezier(.2,1.4,.4,1);pointer-events:none;white-space:nowrap;z-index:6}
#call.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#call.bad{color:var(--bad)}
#ov{position:fixed;inset:0;background:rgba(6,4,3,.86);display:flex;align-items:center;justify-content:center;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 14px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px));overflow:auto}
#ov[hidden]{display:none!important}
.card{width:100%;max-width:400px;background:linear-gradient(180deg,#1b130d,#0f0b08);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);margin:auto}
.card .logo{display:block;width:100%;background:#000}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.cb h2{margin:0;font:900 26px/1.05 var(--display);color:var(--gold-hi);text-wrap:balance}
.cb p{margin:0;font-size:16px;line-height:1.35;color:#ddd1bb}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{background:#21170f;border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pick button:hover{border-color:var(--gold)}
.pick img{width:74px;height:74px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:2px solid var(--gold)}
.pick b{font:700 17px var(--display)}
.pick small{color:var(--mute);font-size:13px;letter-spacing:.06em}
.go{border:0;border-radius:12px;padding:13px;font:800 19px var(--ui);letter-spacing:.12em;color:#1c120a;background:linear-gradient(180deg,var(--gold-hi),#9c7a3c);box-shadow:0 3px 0 #4d3816}
.how{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:15px;color:#ddd1bb}
.how b{color:var(--gold);letter-spacing:.06em}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.res div{background:#21170f;border-radius:10px;padding:8px 4px}
.res b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.res small{font-size:11px;letter-spacing:.12em;color:var(--mute);font-weight:700}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.vs img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:2px solid var(--gold)}
.vs .win img{border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(232,207,148,.35)}
.vs b{display:block;font:700 16px var(--display)}
.vs span{font-size:14px;color:var(--mute)}
.small{font-size:12px;color:var(--mute);text-align:center}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.mt{font-size:13px;font-weight:700;letter-spacing:.08em;color:#6b5844}
.mt b{color:#2a1d12;font-variant-numeric:tabular-nums}
.mt .bar{height:9px;border-radius:5px;background:rgba(0,0,0,.12);overflow:hidden;margin-top:2px}
.mt .bar i{display:block;height:100%;width:0;border-radius:5px;transition:width .15s}
#kickBar{background:#9c3326}#flavBar{background:#b8861f}
.foot button{white-space:nowrap}
.foot #serve{color:#1c120a;background:linear-gradient(180deg,var(--gold-hi),#9c7a3c);border:0}
.crew{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.crew button{background:#21170f;border:1.5px solid var(--line);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.crew button[aria-pressed="false"]{opacity:.45}
.crew button[aria-pressed="true"]{border-color:var(--gold-hi);box-shadow:0 0 0 2px rgba(232,207,148,.3)}
.crew img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:2px solid var(--gold)}
.crew b{font:700 12px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.score{display:grid;gap:8px}
.score .row{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:8px;font-weight:700;letter-spacing:.06em}
.score .bar{height:12px;border-radius:6px;background:#2b1f15;overflow:hidden}.score .bar i{display:block;height:100%}
.podium{display:grid;gap:6px}
.podium div{display:grid;grid-template-columns:22px 44px 1fr auto;align-items:center;gap:10px;background:#21170f;border-radius:12px;padding:6px 10px;border:1.5px solid transparent}
.podium .p1{border-color:var(--gold-hi)}
.podium img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:2px solid var(--gold)}
.podium b{font:700 16px var(--display)}.podium span{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.podium small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.alt{background:#21170f!important;color:var(--ink)!important;box-shadow:none!important;border:1px solid var(--line)!important}
.red{background:linear-gradient(180deg,#d7735f,#7c2a22)!important;color:#fff!important;box-shadow:0 3px 0 #3f140f!important}
@media (prefers-reduced-motion:reduce){#call{transition:none}}
</style>

  <div class="who"><img id="face" alt=""><div><b id="who">ADAM</b><small>BEHIND THE BAR</small></div></div>
  <div class="stat"><div><b id="clock">60</b><small>SECONDS</small></div><div><b id="made">0</b><small id="lbMade">DRINKS</small></div><div><b id="tips">$0</b><small id="lbTips">TIPS</small></div></div>
</div>

</div>

let S='menu',mode='solo',queue=[],turn=0,who='adam',time=60,made=0,tips=0,perfect=0,order=null,glass=null,layers=[],step=0,errs=[],pour=null,res={},fx=[],shake=0,serveT=0,best={adam:0,steph:0};

function newOrder(){let o;do{o=Math.random()<.3?MENU.at(Math.floor(Math.random()*3)):MENU.at(Math.floor(Math.random()*MENU.length))}while(order&&o.n===order.n);order=o;glass=GLASSES[o.g];layers=[];step=0;errs=[];
  const tot=o.r.reduce((s,x)=>s+x[1],0),cap=o.g==='shot'?.9:o.g==='snifter'?.55:o.g==='hurricane'?.9:.86;let acc=0;order.t=o.r.map(x=>(acc+=x[1],acc/tot*cap));drawTicket();speak(o.n)}
function fill(){return layers.reduce((s,l)=>s+l.a,0)}
function drawTicket(){if(order&&order.free)return;$('tkName').textContent=order.n;$('tkGlass').textContent=GLASSES[order.g].n.toUpperCase()+' GLASS';
  $('steps').innerHTML=order.r.map((x,i)=>`<span class="st ${i<step?'done':i===step?'now':''}"><i style="background:${B(x[0]).c}"></i>${B(x[0]).n} ×${x[1]}</span>`).join('')}

/* ---------- Pouring rules ---------- */
function startPour(i){if(S!=='play'||pour||serveT>0)return;const b=BOTTLES.at(i);ac();
  if(order.free){pour={i,b,t:0};gurgle(true);return}
  if(step>=order.r.length)return;
  const cur=order.r.at(step),nxt=order.r.at(step+1);
  if(b.k!==cur[0]){
    if(nxt&&b.k===nxt[0]&&fill()>0){closeStep();}
    else{call('Wrong bottle!',true);sfx.splash();tips=Math.max(0,tips-1);shake=10;dumpGlass(true);hud();return}}
  pour={i,b,t:0};gurgle(true)}
function closeStep(){const tgt=order.t.at(step);errs.push(Math.abs(fill()-tgt));step++;drawTicket()}
function stopPour(){if(!pour)return;gurgle(false);pour=null;
  if(order.free)return;
  const tgt=order.t.at(step);
  if(fill()>=tgt-.05){closeStep();if(step>=order.r.length)serve()}}
function serve(){const err=errs.reduce((s,e)=>s+e,0)/errs.length,sc=Math.max(0,1-err/.12);const tip=Math.round(2+8*sc),per=errs.every(e=>e<.03);
  made++;tips+=tip+(per?3:0);if(per)perfect++;call(per?'Perfect pour! +$'+(tip+3):'Served! +$'+tip);sfx.clink();setTimeout(sfx.till,180);
  for(let k=0;k<18;k++)fx.push({x:GX+(Math.random()-.5)*60,y:COUNTER-glass.h*.6,vx:(Math.random()-.5)*3,vy:-Math.random()*3-1,l:40,c:'#e8cf94'});
  serveT=.55;hud()}
function dumpGlass(silent){layers=[];step=0;errs=[];pour=null;gurgle(false);drawTicket();if(!silent)sfx.splash()}

function glassPath(gl,ox,base){const top=base-gl.y0-gl.h,bot=base-gl.y0,mx=(gl.bx+gl.tx)/2+gl.bulge;g.beginPath();
  if(gl.prof){const N=28;for(let k=0;k<=N;k++){const f=k/N,y=bot-f*gl.h,x=ox-halfAt(gl,f);k?g.lineTo(x,y):g.moveTo(x,y)}for(let k=N;k>=0;k--){const f=k/N;g.lineTo(ox+halfAt(gl,f),bot-f*gl.h)}g.closePath();return}
  g.moveTo(ox-gl.bx,bot);g.quadraticCurveTo(ox-mx,(bot+top)/2,ox-gl.tx,top);g.lineTo(ox+gl.tx,top);g.quadraticCurveTo(ox+mx,(bot+top)/2,ox+gl.bx,bot);g.closePath()}
function halfAt(gl,f){if(gl.prof){const P=gl.prof;let i=0;while(i<P.length-2&&f>P.at(i+1).at(1))i++;const a=P.at(i),b=P.at(i+1),u=Math.max(0,Math.min(1,(f-a.at(1))/(b.at(1)-a.at(1)))),w=(1-Math.cos(u*Math.PI))/2;return a.at(0)+(b.at(0)-a.at(0))*w}const u=f,mx=(gl.bx+gl.tx)/2+gl.bulge;return (1-u)*(1-u)*gl.bx+2*(1-u)*u*mx+u*u*gl.tx}
function drawBar(){
  const bg=g.createLinearGradient(0,0,0,COUNTER);bg.addColorStop(0,'#1a110b');bg.addColorStop(1,'#2b1b11');g.fillStyle=bg;g.fillRect(0,0,W,COUNTER);

  if(logoImg.complete&&logoImg.naturalWidth){g.globalAlpha=.22;g.drawImage(logoImg,GX-95,14,190,134);g.globalAlpha=1}
  for(const sy of[188,262]){g.fillStyle='#4a2f1b';g.fillRect(0,sy,W,6);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,sy+6,W,5);

/* ---------- Mixology Showdown: strongest drink that still tastes great ---------- */
const SPIRITS=['rum','whiskey','tequila','vodka'],SWEET=['pineapple','grenadine','cola'];
function judge(){const tot=fill();if(tot<.12)return{kick:0,flav:0,total:0,note:'An empty glass. The judge is still waiting.'};
  const amt=k=>layers.filter(l=>l.k===k).reduce((s,l)=>s+l.a,0);
  const sp=SPIRITS.reduce((s,k)=>s+amt(k),0),share=sp/tot;
  let kick=50*Math.min(1,share/.5);if(share>.55)kick-=(share-.55)*220;kick=Math.max(0,kick);
  const mix=['pineapple','lime','grenadine','cola'].filter(k=>amt(k)>.02).length,sweet=SWEET.reduce((s,k)=>s+amt(k),0),sour=amt('lime');
  let flav=Math.min(24,mix*8);if(sweet+sour>0){const r=sour/(sweet+sour);flav+=Math.max(0,16*(1-Math.abs(r-.25)/.25))}
  const nsp=SPIRITS.filter(k=>amt(k)>.02).length;if(nsp===2)flav+=4;if(nsp>=3)flav-=6;
  flav+=tot>=.75?10:10*tot/.75;flav=Math.max(0,Math.min(50,flav));
  const total=Math.round(kick)+Math.round(flav);
  const note=share>.7?'Way too boozy. The judge coughs and reaches for water.':share>.55?'Strong, but the liquor drowns out the flavor.':share<.2?'Tasty, but where is the kick?':mix<=1?'Plenty of kick. It needs more flavor.':(sour<.02&&sweet>0)?'Sweet and strong. A squeeze of lime would balance it.':total>=88?'Bold, balanced and dangerous. A Gaspar’s legend!':total>=72?'Strong and tasty. The crowd wants another round.':'A solid pour with room to balance it out.';
  return{kick:Math.round(kick),flav:Math.round(flav),total,note}}

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();SFX=AC.createGain();SFX.connect(AC.destination);
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;comp.connect(AC.destination);MUS=AC.createGain();MUS.gain.value=0;MUS.connect(comp);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const dd=NB.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();return AC}
const midi=m=>440*Math.pow(2,(m-69)/12);
function nz(dest,t,dur,type,freq,q,vol,att){const a=AC;const s=a.createBufferSource();s.buffer=NB;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const gn=a.createGain();
  gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(vol,t+(att||.003));gn.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(gn);gn.connect(dest);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);return f}
function osc(dest,t,dur,type,fr,vol,toFr,att){const a=AC;const o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.setValueAtTime(fr,t);if(toFr)o.frequency.exponentialRampToValueAtTime(toFr,t+dur*.6);
  gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(vol,t+(att||.004));gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gn);gn.connect(dest);o.start(t);o.stop(t+dur+.05);return o}
function noise(dur,freq,q,vol,att){const a=ac();if(!a||!sound)return;nz(SFX,a.currentTime,dur,'bandpass',freq,q,vol,att)}
function tone(fr,dur,delay,vol){const a=ac();if(!a||!sound)return;osc(SFX,a.currentTime+(delay||0),dur,'sine',fr,vol||.2)}
const sfx={
  hit:p=>{noise(.09,2400,.8,.7*p+.2);tone(160,.07,0,.25)},
  putt:()=>{tone(1300,.04,0,.12);noise(.03,3000,1,.2)},
  whoosh:()=>{const a=ac();if(!a||!sound)return;const f=nz(SFX,a.currentTime,.28,'bandpass',500,1.2,.28,.12);f.frequency.exponentialRampToValueAtTime(2600,a.currentTime+.24)},
  tick:()=>tone(1500,.025,0,.05),
  thud:()=>{tone(85,.14,0,.3);noise(.06,400,.7,.25)},
  splash:()=>noise(.7,500,.6,.45,.03),
  sand:()=>noise(.25,900,.5,.4),
  cup:()=>{tone(700,.06,0,.25);tone(520,.1,.07,.25)},
  cheer:()=>{noise(2.2,1400,.4,.28,.35);noise(2,900,.6,.2,.5)},
  clap:()=>{const a=ac();if(!a||!sound)return;for(let k=0;k<26;k++)nz(SFX,a.currentTime+k*.045+Math.random()*.03,.05,'bandpass',2200+Math.random()*900,1,.12+Math.random()*.08)},
  ooh:()=>{const a=ac();if(!a||!sound)return;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=800;lp.connect(SFX);const t=a.currentTime;
    for(const fr of[170,205,240,290]){const o=a.createOscillator(),gn=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(fr,t);o.frequency.linearRampToValueAtTime(fr*.82,t+1);gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(.05,t+.25);gn.gain.exponentialRampToValueAtTime(.0001,t+1.1);o.connect(gn);gn.connect(lp);o.start(t);o.stop(t+1.2)}}
};

/* Original beats in two classic hip-hop styles (no samples, no borrowed melodies) */
function kick(t,dusty){osc(MUS,t,.38,'sine',150,.95,42);if(dusty)nz(MUS,t,.05,'lowpass',900,.5,.25)}
function snare(t,v){nz(MUS,t,.2,'bandpass',1900,.6,.5*(v||1));osc(MUS,t,.09,'triangle',190,.25*(v||1))}
function clap(t){for(let k=0;k<3;k++)nz(MUS,t+k*.011,.12,'bandpass',1300,.9,.38)}
function hat(t,open,v){nz(MUS,t,open?.24:.04,'highpass',7500,.7,(open?.16:.11)*(v||1))}
function bass(t,m,dur,type,from){const a=AC,o=a.createOscillator(),f=a.createBiquadFilter(),gn=a.createGain();o.type=type;o.frequency.setValueAtTime(midi(from||m),t);if(from)o.frequency.exponentialRampToValueAtTime(midi(m),t+.07);
  f.type='lowpass';f.frequency.value=type==='sine'?900:420;gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(.42,t+.01);gn.gain.setTargetAtTime(.0001,t+dur*.85,.05);o.connect(f);f.connect(gn);gn.connect(MUS);o.start(t);o.stop(t+dur+.3)}
function whistle(t,m,dur,from){const a=AC,o=a.createOscillator(),lfo=a.createOscillator(),lg=a.createGain(),gn=a.createGain();o.type='sine';o.frequency.setValueAtTime(midi(from||m),t);o.frequency.exponentialRampToValueAtTime(midi(m),t+.07);
  lfo.frequency.value=5.6;lg.gain.value=7;lfo.connect(lg);lg.connect(o.frequency);gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(.075,t+.05);gn.gain.setTargetAtTime(.0001,t+dur*.9,.06);o.connect(gn);gn.connect(MUS);o.start(t);lfo.start(t);o.stop(t+dur+.4);lfo.stop(t+dur+.4)}
function keys(t,ms,dur){const a=AC,f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=2400;f.connect(MUS);for(const m of ms){const o=a.createOscillator(),gn=a.createGain();o.type='triangle';o.frequency.value=midi(m);
  gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(.07,t+.006);gn.gain.exponentialRampToValueAtTime(.0001,t+Math.min(1.4,dur*1.6));o.connect(gn);gn.connect(f);o.start(t);o.stop(t+1.5)}}
const WEST_ROOT=[40,36,38,35],WEST_LEAD=[[0,83,4],[6,81,2],[8,79,4],[12,76,4],[16,79,6],[24,81,2],[26,79,2],[28,76,4],[32,86,3],[36,83,2],[38,81,2],[40,83,6],[48,79,4],[52,81,2],[54,79,2],[56,76,8]];
const EAST_CH=[[57,60,64,67],[53,57,60,64],[50,53,57,60],[52,55,59,62]];
let lastLead=0,lastBass=0;
const STY={
  west:{bpm:92,swing:.57,play:(s,t,six)=>{const b=Math.floor(s/16),i=s%16,r=WEST_ROOT.at(b);
    if(i===0||i===8||i===10)kick(t);if(i===4||i===12){clap(t);snare(t,.5)}if(i%2===0)hat(t,false,i%4===0?1:.6);if(i===15)hat(t,false,.4);
    const bn=i===0?[r,6]:i===7?[r+12,1]:i===8?[r,3]:i===11?[r+3,2]:i===14?[r+5,2]:null;if(bn){bass(t,bn[0],bn[1]*six,'sine',lastBass&&Math.abs(lastBass-bn[0])<8?lastBass:0);lastBass=bn[0]}
    const ld=WEST_LEAD.find(x=>x[0]===s);if(ld){whistle(t,ld[1],ld[2]*six,lastLead);lastLead=ld[1]}}},
  east:{bpm:88,swing:.62,play:(s,t,six)=>{const b=Math.floor(s/16),i=s%16,ch=EAST_CH.at(b);
    if(i===0||i===10||(b%2===0&&i===7)||(b%2===1&&i===13))kick(t,true);if(i===4||i===12)snare(t,1);if(i%2===0)hat(t,b===3&&i===14,i%4===2?1:.55);
    if(i===0)keys(t,ch,3*six);if(i===6)keys(t,ch,2*six);if(i===11)keys(t,ch.map(m=>m+12),2*six);
    if(i===0)bass(t,ch.at(0)-24,4*six,'triangle');if(i===10)bass(t,ch.at(0)-24,2*six,'triangle');if(i===13)bass(t,ch.at(1)-24,2*six,'triangle');
    if(Math.random()<.35)nz(MUS,t+Math.random()*six,.01,'highpass',3000,.5,.035)}}
};
let musicMode='west',voiceOn=true,nextT=0,stepN=0,schedT=0,ducked=false;
try{const m=localStorage.getItem('pour-music');if(m==='off'||m==='west'||m==='east')musicMode=m;voiceOn=localStorage.getItem('pour-voice')!=='off';sound=localStorage.getItem('pour-sfx')!=='off'}catch(e){}
const musVol=()=>ducked?.12:.32;
function sched(){if(!AC||musicMode==='off')return;const st=STY[musicMode],six=60/st.bpm/4;while(nextT<AC.currentTime+.15){const s=stepN%64,sw=(s%2)?(st.swing-.5)*2*six:0;st.play(s,nextT+sw,six);nextT+=six;stepN++}}
function startMusic(){const a=ac();if(!a)return;clearInterval(schedT);if(musicMode==='off'){MUS.gain.setTargetAtTime(0,a.currentTime,.15);return}
  MUS.gain.setTargetAtTime(musVol(),a.currentTime,.4);nextT=a.currentTime+.1;stepN=0;lastLead=lastBass=0;schedT=setInterval(sched,25)}
function duck(on){ducked=on;if(AC&&MUS&&musicMode!=='off')MUS.gain.setTargetAtTime(musVol(),AC.currentTime,.12)}
/* Commentary: the device's deepest available English voice, slowed and lowered */
let VOICES=[];function loadV(){try{VOICES=window.speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){loadV();try{window.speechSynthesis.onvoiceschanged=loadV}catch(e){}}
function pickVoice(){const en=VOICES.filter(v=>/^en/i.test(v.lang));for(const p of['Daniel','Arthur','Aaron','Alex','Fred','Ralph','Gordon','Rishi','Google UK English Male','Microsoft Guy','Microsoft Davis','Microsoft David','Microsoft Mark']){const v=en.find(x=>x.name.indexOf(p)>=0);if(v)return v}return en.find(v=>/male/i.test(v.name)&&!/female/i.test(v.name))||en.at(0)||null}
function speak(t){if(!voiceOn||!('speechSynthesis' in window)||!t)return;try{const ss=window.speechSynthesis;ss.cancel();const u=new SpeechSynthesisUtterance(t);const v=pickVoice();if(v)u.voice=v;u.pitch=.55;u.rate=.86;
  u.onstart=()=>duck(true);u.onend=()=>duck(false);u.onerror=()=>duck(false);ss.speak(u)}catch(e){}}
function audLabels(){const m=$('bMus');m.textContent='♫ '+(musicMode==='off'?'OFF':musicMode==='west'?'WEST':'EAST');m.setAttribute('aria-label','Music: '+(musicMode==='off'?'off':musicMode==='west'?'West Coast G-funk':'East Coast boom-bap'));
  $('bSfx').setAttribute('aria-pressed',String(sound));$('bVox').setAttribute('aria-pressed',String(voiceOn))}
function saveAud(){try{localStorage.setItem('pour-music',musicMode);localStorage.setItem('pour-voice',voiceOn?'on':'off');localStorage.setItem('pour-sfx',sound?'on':'off')}catch(e){}}


sfx.clink=()=>{tone(2100,.25,0,.12);tone(2650,.3,.04,.09)};
sfx.till=()=>{tone(1250,.08,0,.14);tone(1650,.22,.08,.12);noise(.05,4000,1,.15)};
let gNode=null;function gurgle(on){const a=ac();if(!a||!sound){return}if(on&&!gNode){const s=a.createBufferSource();s.buffer=NB;s.loop=true;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=520;f.Q.value=3;const gn=a.createGain();gn.gain.value=.0;const lfo=a.createOscillator();lfo.frequency.value=9;const lg=a.createGain();lg.gain.value=.12;lfo.connect(lg);lg.connect(gn.gain);s.connect(f);f.connect(gn);gn.connect(SFX);s.start();lfo.start();gn.gain.setTargetAtTime(.14,a.currentTime,.03);gNode={s,lfo,gn}}
  else if(!on&&gNode){const n=gNode;gNode=null;n.gn.gain.setTargetAtTime(0,a.currentTime,.04);setTimeout(()=>{try{n.s.stop();n.lfo.stop()}catch(e){}},200)}}
musicMode=(function(){try{return localStorage.getItem('pour-music')||'east'}catch(e){return 'east'}})();
$('bSfx').onclick=()=>{ac();sound=!sound;audLabels();saveAud()};
$('bMus').onclick=()=>{musicMode=musicMode==='off'?'west':musicMode==='west'?'east':'off';startMusic();audLabels();saveAud();call(musicMode==='off'?'Music off':musicMode==='west'?'West Coast':'East Coast')};
$('bVox').onclick=()=>{voiceOn=!voiceOn;if(!voiceOn)try{window.speechSynthesis.cancel()}catch(e){}audLabels();saveAud()};
audLabels();menu();requestAnimationFrame(loop);
})();
