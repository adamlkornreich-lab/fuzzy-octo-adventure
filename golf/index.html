<style>
/* Layout: full-bleed broadcast camera view; score bug top-left, hole map top-right, swing bar and controls docked at the bottom. Single dark broadcast look. */
:root{
  --night:#0b1a26; --panel:rgba(10,24,36,.86); --panel-solid:#10263a;
  --ink:#f4efe2; --mute:#a9bccb; --gold:#e9b44c; --gold-deep:#b9822a;
  --red:#c8372d; --turf:#2f8a45; --line:rgba(233,180,76,.45);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pirate:"Pirata One",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font:15px/1.4 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Score bug */
#bug{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-family:var(--display);box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:5}
#bug img{width:52px;height:52px;object-fit:cover;object-position:50% 30%;display:block}
#bug .cell{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 9px;border-left:1px solid rgba(255,255,255,.08);min-width:34px}
#bug .name{align-items:flex-start;padding-left:9px}
#bug b{font-size:19px;font-weight:800;letter-spacing:.04em;line-height:1}
#bug small{font-size:10px;letter-spacing:.12em;color:var(--mute);font-weight:600;line-height:1.2}
#bug .big{font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#topar{color:var(--gold)}
#topar.under{color:#ff6b5b}

/* Map + wind */
#side{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:5}
#mapw{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px}
#map{display:block;width:74px;height:150px}
#wind{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px;display:flex;align-items:center;gap:6px;font:700 14px var(--display);letter-spacing:.04em}
#wind svg{width:22px;height:22px;transition:transform .3s}

/* Commentary + lower third */
#call{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);max-width:min(78vw,440px);text-align:center;font:600 16px/1.25 var(--display);letter-spacing:.02em;background:rgba(10,24,36,.72);padding:6px 12px;border-radius:8px;transition:opacity .4s;opacity:0;z-index:4;pointer-events:none}
#call.on{opacity:1}
#l3{position:fixed;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(var(--ctrl,130px) + 64px);display:flex;font-family:var(--display);z-index:4;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s;transform:translateX(-120%);opacity:0;pointer-events:none}
#l3.on{transform:none;opacity:1}
#l3 .num{background:var(--gold);color:#1b1206;font-size:40px;font-weight:800;padding:2px 12px;line-height:1.1;display:flex;align-items:center}
#l3 .txt{background:var(--panel-solid);padding:6px 12px;border-top:2px solid var(--gold)}
#l3 .txt b{display:block;font-family:var(--pirate);font-weight:400;font-size:24px;line-height:1.05}
#l3 .txt span{font-size:14px;letter-spacing:.1em;color:var(--mute);font-weight:600}
#pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);font:800 44px var(--display);letter-spacing:.06em;color:var(--gold);text-shadow:0 3px 0 #5a3a0a,0 0 24px rgba(233,180,76,.6);opacity:0;transition:all .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;z-index:6;white-space:nowrap}
#pop.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* Controls */
#ctrl{position:fixed;left:0;right:0;bottom:0;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));background:linear-gradient(to top,rgba(8,18,28,.96),rgba(8,18,28,.8));border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;z-index:5}
.row{display:flex;gap:6px;align-items:center;min-width:0}
.pill{display:flex;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;min-width:0}
.pill button{background:none;border:0;width:34px;height:44px;font:700 20px var(--display);color:var(--gold)}
.pill button:active{background:rgba(233,180,76,.15)}
.pill .lab{flex:1;min-width:0;text-align:center;font-family:var(--display);line-height:1.05;padding:0 2px}
.pill .lab b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .lab small{font-size:11px;color:var(--mute);letter-spacing:.08em;font-weight:600}
#clubP{flex:1.25}#aimP{flex:1}
.pill .lab b{font-size:16px}
#swing{width:86px;height:58px;border-radius:14px;border:0;background:linear-gradient(180deg,#f2c35e,var(--gold-deep));color:#1b1206;font:800 20px var(--display);letter-spacing:.08em;box-shadow:0 3px 0 #6e4810,0 6px 16px rgba(0,0,0,.4)}
#swing:active{transform:translateY(2px);box-shadow:0 1px 0 #6e4810}
#aud{display:flex;gap:4px}#aud button{background:var(--panel);border:1px solid var(--line);border-radius:8px;height:30px;min-width:34px;padding:0 7px;font:700 12px var(--display);letter-spacing:.06em;color:var(--ink)}#aud button[aria-pressed="false"]{opacity:.45}

/* Overlay */
#ov{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(16,44,30,.9),rgba(6,12,18,.96));display:flex;align-items:center;justify-content:center;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));overflow:auto}
#ov[hidden]{display:none!important}
.card{width:100%;max-width:400px;background:linear-gradient(180deg,#132c42,#0c1c2a);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);margin:auto}
.hero{position:relative;height:250px;overflow:hidden;background:#123}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#0f2436 96%)}
.hero .tag{position:absolute;left:16px;bottom:12px;z-index:1}
.hero .tag small{font:700 12px var(--display);letter-spacing:.2em;color:var(--gold)}
.hero h1{margin:0;font:400 44px/0.95 var(--pirate);text-shadow:0 2px 10px rgba(0,0,0,.6);text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid rgba(255,255,255,.08)}
.stats div{padding:9px 6px;text-align:center;font-family:var(--display)}
.stats b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stats small{font-size:10px;letter-spacing:.14em;color:var(--mute);font-weight:600}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.cb p{margin:0;color:#d9e2e8;font-size:14px}
.how{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;color:#d9e2e8}
.how b{font-family:var(--display);color:var(--gold);font-size:15px;letter-spacing:.04em}
.go{border:0;border-radius:12px;padding:14px;background:linear-gradient(180deg,#f2c35e,var(--gold-deep));color:#1b1206;font:800 20px var(--display);letter-spacing:.1em}
.res h2{margin:0;font:800 34px/1 var(--display);letter-spacing:.04em;color:var(--gold);text-wrap:balance}
.res .sub{font:600 15px var(--display);letter-spacing:.06em;color:var(--mute)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font:600 13px var(--display);font-variant-numeric:tabular-nums}
th{font-size:10px;letter-spacing:.12em;color:var(--mute);font-weight:600;text-align:center;padding:3px 2px}
td{text-align:center;padding:4px 2px;border-top:1px solid rgba(255,255,255,.07)}
td.l,th.l{text-align:left}
.sc-b{color:#ff6b5b}.sc-e{color:var(--gold)}.sc-o{color:var(--mute)}
tr.me td{background:rgba(233,180,76,.12)}
.lbface{width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:5px}
.foot{font-size:11px;color:var(--mute);text-align:center}
.celeb{position:relative}
.celeb .burst{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 30% 30%,rgba(255,220,120,.5) 0 3px,transparent 4px),radial-gradient(circle at 70% 20%,rgba(255,255,255,.6) 0 2px,transparent 3px),radial-gradient(circle at 80% 60%,rgba(255,220,120,.5) 0 3px,transparent 4px),radial-gradient(circle at 20% 70%,rgba(255,255,255,.5) 0 2px,transparent 3px);animation:tw 1.2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#l3,#pop,#call{transition:none}.celeb .burst{animation:none}}
@media (max-height:560px){.hero{height:150px}#map{height:110px;width:56px}}
</style>

function mkHole(i){
  const H=Object.assign({},HOLES[i]),r=rng(i*7919+31+(HOLES[i].seed||0)*104729);
  H.bend=H.par===3?(r()-.5)*10:(r()<.5?-1:1)*(18+r()*34);
  H.fw=H.par===3?16:17+r()*6;
  H.cx=y=>H.bend*ss(y/H.L);
  H.green={x:H.cx(H.L),y:H.L,rx:15,ry:13};
  H.fringe={x:H.green.x,y:H.green.y,rx:17.5,ry:15.5};
  H.cup={x:H.green.x+(r()-.5)*15,y:H.green.y+(r()-.5)*11};
  H.slope={x:(r()-.5)*.55,y:(r()-.5)*.55};
  H.sand=[];H.water=[];
  for(let k=0;k<2;k++){const a=(k?1:-1)*(0.9+r()*1.2)+(r()<.3?Math.PI:0);H.sand.push({x:H.green.x+Math.sin(a)*20,y:H.green.y-Math.cos(a)*17,rx:7+r()*3,ry:4.5+r()*2})}
  if(H.par>3){const y=230+r()*40,s=r()<.5?-1:1;H.sand.push({x:H.cx(y)+s*(H.fw-2),y,rx:9+r()*4,ry:6})}
  if(H.par===5){const y=H.L-110,s=-Math.sign(H.bend)||1;H.sand.push({x:H.cx(y)+s*(H.fw-4),y,rx:11,ry:6})}
  if(i%3===1)H.water.push({x:H.green.x,y:H.L-32,rx:24,ry:8});
  if(i%2===1&&!H.island){const y=H.L*.55,s=Math.sign(H.bend)||1;H.water.push({x:H.cx(y)+s*(H.fw+10),y,rx:13,ry:46})}
  if(i===8)H.water.push({x:H.green.x+24,y:H.L-6,rx:10,ry:22});
  H.wind={a:r()*Math.PI*2,s:Math.round(r()*14)};
  H.trees=[];
  for(let y=-14;y<H.L+40;y+=16+r()*14){for(const s of[-1,1]){if(r()<.25)continue;const off=H.fw+6+r()*18,x=H.cx(Math.min(y,H.L))+s*off;
    if(H.island&&y>16&&y<H.L-20)continue;
    if(inE({x:H.fringe.x,y:H.fringe.y,rx:24,ry:22},x,y))continue;
    if(H.water.some(e=>inE({x:e.x,y:e.y,rx:e.rx+4,ry:e.ry+4},x,y))||H.sand.some(e=>inE({x:e.x,y:e.y,rx:e.rx+3,ry:e.ry+3},x,y)))continue;
    H.trees.push({x,y,h:7+r()*4,lean:(r()-.5)*2.5,s:r()})}}
  for(let k=0;k<5;k++){const x=H.green.x+(r()-.5)*50,y=H.L+26+r()*14;H.trees.push({x,y,h:8+r()*4,lean:(r()-.5)*2,s:r()})}
  H.clouds=[];for(let k=0;k<7;k++)H.clouds.push({b:r()*Math.PI*2,e:.05+r()*.18,w:.12+r()*.18});
  H.isles=[];for(let k=0;k<4;k++)H.isles.push({b:r()*Math.PI*2,w:.08+r()*.16,h:.01+r()*.025});
  H.ship=r()*Math.PI*2;
  return H;
}
/* terrain codes: 0 fairway 1 rough 2 green 3 sand 4 water 5 beach 6 ocean 7 tee 8 fringe */
function ter(x,y){
  if(inE(h.green,x,y))return 2;
  for(const e of h.water)if(inE(e,x,y))return 4;
  for(const e of h.sand)if(inE(e,x,y))return 3;
  if(inE(h.fringe,x,y))return 8;
  if(x>-6&&x<6&&y>-5&&y<7)return 7;
  if(h.island&&y>14&&y<h.L-19)return 4;
  if(y>h.L+46)return 6; if(y>h.L+34)return 5;
  if(y<-26)return 6; if(y<-16)return 5;

function drawMeter(){

  const bw=Math.min(VW-36,440),x0=(VW-bw)/2,y=VH-ctrlH-34,hh=16;
  g.fillStyle='rgba(8,18,28,.82)';g.beginPath();g.roundRect(x0-8,y-20,bw+16,hh+30,10);g.fill();
  const gr=g.createLinearGradient(x0,0,x0+bw,0);gr.addColorStop(0,'#2f8a45');gr.addColorStop(.6,'#e9c24c');gr.addColorStop(FULL,'#e98a3c');gr.addColorStop(FULL+.001,'#c8372d');gr.addColorStop(1,'#8f1f18');
  g.fillStyle=gr;g.beginPath();g.roundRect(x0,y,bw,hh,4);g.fill();
  g.fillStyle='#fff';g.fillRect(x0+bw*SNAP-1.5,y-4,3,hh+8);
  g.fillStyle='#1b1206';g.fillRect(x0+bw*FULL-1,y,2,hh);
  const nx=x0+bw*Math.min(1,need*FULL);g.fillStyle='#7fe3ff';g.beginPath();g.moveTo(nx-5,y-7);g.lineTo(nx+5,y-7);g.lineTo(nx,y-1);g.fill();
  if(meter.ph==='down'||meter.ph==='done'){const px=x0+bw*Math.min(1,meter.pw*FULL);g.fillStyle='#e9b44c';g.fillRect(px-2,y-4,4,hh+8)}
  if(meter.ph!=='idle'){const mx=x0+bw*Math.max(0,meter.m);g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=1.5;g.beginPath();g.roundRect(mx-3,y-6,6,hh+12,2);g.fill();g.stroke()}
  g.font='700 12px "Barlow Condensed",Arial Narrow,sans-serif';g.fillStyle='#f4efe2';g.textAlign='left';g.textBaseline='alphabetic';
  const msg=meter.ph==='idle'?(club===PUTTER?'TAP SWING, THEN TAP AGAIN FOR PACE':'TAP SWING TO START'):meter.ph==='up'?(club===PUTTER?'TAP FOR PACE':'TAP FOR POWER'):meter.ph==='down'?'TAP ON THE WHITE LINE':'';
  g.fillText(msg,x0,y-8);g.textAlign='right';g.fillStyle='#7fe3ff';g.fillText(club===PUTTER?'▼ PACE TO HOLE':'▼ DISTANCE TO PIN',x0+bw,y-8);g.textAlign='left';
}
function loop(ts){const dt=Math.min(.05,(ts-lt)/1000||.016);lt=ts;if(S!=='intro'&&S!=='result')update(dt);draw();requestAnimationFrame(loop)}

/* ---------- Input ---------- */
function rotAim(dd){if(S!=='aim')return;aim+=dd;aimOff+=dd;setCam();hud()}
function chClub(dd){if(S!=='aim')return;if(club===PUTTER&&!onGreenish())return;let c=club+dd;const max=onGreenish()?7:6,min=ter(B.x,B.y)===7?0:1;c=Math.max(onGreenish()?7:min,Math.min(max,c));if(onGreenish())c=7;club=c;computeNeed();autoAim();setCam();hud()}
function holdBtn(el,fn){let iv=0,to=0;const stop=()=>{clearTimeout(to);clearInterval(iv)};el.addEventListener('pointerdown',e=>{e.preventDefault();fn();to=setTimeout(()=>iv=setInterval(fn,60),320)});['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,stop))}
holdBtn($('aL'),()=>rotAim(-(club===PUTTER?.004:.0087)));holdBtn($('aR'),()=>rotAim(club===PUTTER?.004:.0087));
$('cDn').onclick=()=>chClub(-1);$('cUp').onclick=()=>chClub(1);
$('swing').addEventListener('pointerdown',e=>{e.preventDefault();tap()});
cv.addEventListener('pointerdown',e=>{if(S==='meter')tap()});
$('bSfx').onclick=()=>{ac();sound=!sound;audLabels();saveAud()};$('bMus').onclick=()=>{musicMode=musicMode==='off'?'west':musicMode==='west'?'east':'off';startMusic();audLabels();saveAud();say(musicMode==='off'?'Music off':musicMode==='west'?'West Coast G-funk':'East Coast boom-bap',1400,'')};$('bVox').onclick=()=>{voiceOn=!voiceOn;if(!voiceOn)try{window.speechSynthesis.cancel()}catch(e){}audLabels();saveAud()};audLabels();
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k===' '||k==='Enter'){if(!$('ov').hidden){const b=$('ov').querySelector('button');if(b&&document.activeElement!==b){e.preventDefault();b.click()}return}e.preventDefault();tap()}
  else if(k==='ArrowLeft'){e.preventDefault();rotAim(-(club===PUTTER?.004:.0087))}else if(k==='ArrowRight'){e.preventDefault();rotAim(club===PUTTER?.004:.0087)}
  else if(k==='ArrowUp'){e.preventDefault();chClub(-1)}else if(k==='ArrowDown'){e.preventDefault();chClub(1)}
});

/* ---------- Intro ---------- */
function intro(resumeAt){
  showOverlay(`<div class="card"><div class="hero"><img src="${CARD}" alt="Andy"><div class="tag"><small>GASPAR'S BAY LINKS · PRO TOUR</small><h1>Andy Seavy Golf Club</h1></div></div>
  <div class="stats"><div><b>9</b><small>HOLES</small></div><div><b>${HOLES.reduce((a,H)=>a+H.par,0)}</b><small>PAR</small></div><div><b>${best===null?'—':fmtPar(best)}</b><small>YOUR BEST</small></div></div>
  <div class="cb"><p>Andy tees it up against the pirate tour pros on nine seaside holes, island green included. Read the wind, pick your club, and nail the three-tap swing.</p>
  <div class="how"><b>TAP 1</b><span>Start the backswing</span><b>TAP 2</b><span>Set power. The blue marker shows the distance to the pin</span><b>TAP 3</b><span>Stop on the white line for a straight, perfect strike</span><b>Aim</b><span>◂ ▸ to aim, ‹ › to change club. Putts show the break</span></div>
  <button class="go" id="nb">${resumeAt?'CONTINUE · HOLE '+(resumeAt+1):'TEE OFF'}</button>
  <div class="foot">Original West Coast and East Coast beats (♫ button) and a deep-voiced announcer (🎙). Keyboard and TV remote: arrows to aim and pick a club, Enter to swing</div></div></div>`);
  $('nb').onclick=()=>{ac();startMusic();hideOverlay();loadHole(resumeAt||0)};
}
function start(data){
  resize();
  if(data&&Array.isArray(data.card)&&data.card.length&&data.card.length<9&&Array.isArray(data.AI)){card=data.card;AI=data.AI;intro(card.length)}else{genAI();intro(0)}
  buildMap();setCam();requestAnimationFrame(loop);
}
window.poyHost?.hot?.snapshot?.(()=>({card,AI}));
window.poyHost?.hot?.ready?window.poyHost.hot.ready(start):start(window.poyHost?.hot?.data??{});
})();
</script>
