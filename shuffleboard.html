<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shuffleboard — The Pirates of Ybor</title><link rel="stylesheet" href="assets/site.css"></head>
<body>
<main class="wrap">
  <section class="hero"><h1>🪨 Shuffleboard</h1><p class="lead">Four pucks each. Drag right from your puck and release to slide. A short, gentle drag goes a long way. Zones score 1, 2 and 3 — pucks that hang off the end score 4. Knock the other crew out of the zones.</p></section>
  <section class="panel">
    <div class="hud"><select id="mode" style="width:auto"><option value="ai">Vs Ship AI</option><option value="2p">Two players</option></select><span class="stat" id="turn">Red to slide</span><span class="stat" id="score">Red 0 · Blue 0</span><button class="btn" id="start">New Game</button></div>
    <canvas class="game" id="c" width="900" height="360"></canvas>
    <p id="log" style="text-align:center;color:var(--mute)"></p>
  </section>
</main>
<script src="assets/site.js"></script>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");const log=m=>document.getElementById("log").textContent=m;
let pucks,turn,left,drag=null,moving=false,over=false,aiT=null;
function reset(){clearTimeout(aiT);moving=false;drag=null;pucks=[];turn=0;left=[4,4];over=false;place();hud();log("");}
function place(){pucks=pucks.filter(p=>!p.live);pucks.push({x:80,y:180,vx:0,vy:0,c:turn,live:true});}
function hud(){document.getElementById("turn").textContent=over?"Game over":(turn?"Blue":"Red")+" to slide";const s=score();document.getElementById("score").textContent=`Red ${s[0]} · Blue ${s[1]}`;}
function zone(p){if(p.x>880)return 0;if(p.x>830)return 4;if(p.x>760)return 3;if(p.x>680)return 2;if(p.x>600)return 1;return 0;}
function score(){const s=[0,0];pucks.forEach(p=>{if(!p.live)s[p.c]+=zone(p);});return s;}
function pos(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*900/r.width,(e.clientY-r.top)*360/r.height];}
c.addEventListener("pointerdown",e=>{if(moving||over)return;if(document.getElementById("mode").value==="ai"&&turn===1)return;const p=pos(e),k=pucks.find(q=>q.live);if(Math.hypot(p[0]-k.x,p[1]-k.y)<40)drag=p;});
c.addEventListener("pointermove",e=>{if(drag)drag=pos(e);});
window.addEventListener("pointerup",()=>{if(!drag)return;const k=pucks.find(q=>q.live);const dx=drag[0]-k.x,dy=drag[1]-k.y;drag=null;if(dx<10)return;slide(k,Math.min(dx,300)/300*22,dy/300*8);});
function slide(k,vx,vy){k.vx=vx;k.vy=vy;k.live=false;moving=true;left[turn]--;}
function aiVel(){return [8.6+Math.random()*3.2,(Math.random()-.5)*1.6];}
function aiSlide(){const k=pucks.find(q=>q.live);aiT=setTimeout(()=>{const w=aiVel();slide(k,w[0],w[1]);},600);}
function step(){if(moving){let any=false;pucks.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy*=.985;if(p.y<30||p.y>330){p.vy*=-.5;p.y=Math.max(30,Math.min(330,p.y));}if(Math.abs(p.vx)+Math.abs(p.vy)>.1)any=true;});
  for(let i=0;i<pucks.length;i++)for(let j=i+1;j<pucks.length;j++){const a=pucks[i],b=pucks[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<36&&d>0){const nx=(b.x-a.x)/d,ny=(b.y-a.y)/d,rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rel>0){a.vx-=rel*nx;a.vy-=rel*ny;b.vx+=rel*nx;b.vy+=rel*ny;}const o=(36-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;}}
  pucks=pucks.filter(p=>p.x<920);
  if(!any){moving=false;pucks.forEach(p=>{p.vx=p.vy=0;});if(left[0]+left[1]===0){over=true;const s=score();if(s[0]>s[1]||(s[0]!==s[1]&&document.getElementById("mode").value==="2p"))PY.celebrate();log(s[0]===s[1]?"Tie game!":(s[0]>s[1]?"Red":"Blue")+" crew wins!");PY.best("shuffle",s[0]);}else{turn=left[1-turn]>0?1-turn:turn;place();if(document.getElementById("mode").value==="ai"&&turn===1)aiSlide();}hud();}}
  render();requestAnimationFrame(step);}
function render(){x.fillStyle="#2a1a0e";x.fillRect(0,0,900,360);x.fillStyle="#c9a063";x.fillRect(20,20,860,320);
  [[600,"1"],[680,"2"],[760,"3"],[830,"4"]].forEach(([z,l])=>{x.strokeStyle="#5a3a1a";x.lineWidth=3;x.beginPath();x.moveTo(z,20);x.lineTo(z,340);x.stroke();x.fillStyle="rgba(90,58,26,.6)";x.font="bold 40px Georgia";x.fillText(l,z+20,190);});
  const k=pucks.find(q=>q.live);if(drag&&k){x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.moveTo(k.x,k.y);x.lineTo(drag[0],drag[1]);x.stroke();}
  pucks.forEach(p=>{x.fillStyle=p.c?"#2a6fa8":"#b5532a";x.beginPath();x.arc(p.x,p.y,18,0,7);x.fill();x.strokeStyle="#e8b84a";x.lineWidth=3;x.stroke();});}
document.getElementById("start").onclick=reset;document.getElementById("mode").onchange=reset;reset();step();
</script>
</body></html>
