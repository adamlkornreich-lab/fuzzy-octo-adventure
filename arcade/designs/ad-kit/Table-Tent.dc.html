<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table tent, scan to play</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&amp;family=Alegreya:wght@400;700&amp;family=Alegreya+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0b1a26}a:hover{color:#5a3720}
</style>
</helmet>
<div style="width: 384px; height: 576px; box-sizing: border-box; background: #f3ead7; color: #0b1a26; font-family: Alegreya, Georgia, serif; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; border: 10px solid {{accent}}">
<div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
<p style="margin: 0; font-family: 'Alegreya Sans', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #5a3720">Pirates of Ybor</p>
<h1 style="margin: 0; font-family: 'Pirata One', Georgia, serif; font-weight: 400; font-size: 46px; line-height: 0.95; color: #0b1a26">Free pirate games while you wait</h1>
</div>
<img src="/_blob/9be0ad74e6b7a88c38210e6206bb35c7" alt="QR code that opens thepiratesofybor.com" style="width: 196px; height: 196px; display: block">
<div style="display: flex; flex-direction: column; gap: 4px; align-items: center">
<p style="margin: 0; font-family: 'Alegreya Sans', sans-serif; font-weight: 800; font-size: 22px; color: #0b1a26">Scan to play · Trivia · Golf · Chess</p>
<p style="margin: 0; font-family: 'Alegreya Sans', sans-serif; font-weight: 700; font-size: 17px; color: #5a3720">thepiratesofybor.com</p>
<div style="display: flex; align-items: center; gap: 6px; margin-top: 6px">
<img src="/_blob/a8053dfe81f28d9bb62b27f5dbcd2761" alt="Pops and Pippy watermark" style="width: 30px; height: 31px">
<span style="font-family: 'Alegreya Sans', sans-serif; font-size: 12px; color: #3b2414">© 2026 Adam Kornreich / R.A. Consulting ❤ Pops &amp; Pippy</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e0b056","options":["#e0b056","#3fb6a8","#c4572b"]},"$preview":{"width":384,"height":576}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#e0b056' };
  }
}
</script>
</body>
</html>
