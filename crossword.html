/* ---------- Puzzle generator ---------- */
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}

    put(first,mid-(first.a.length>>1),mid,1,0);
    for(const w of list){if(placed.length>=target)break;if(placed.some(p=>p.w.a===w.a))continue;

        const xs=[...g.keys()].map(k=>+k.split(",")[0]).concat(x,x+dx*(w.a.length-1)),ys=[...g.keys()].map(k=>+k.split(",")[1]).concat(y,y+dy*(w.a.length-1));
        const span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))+1;if(span>15)continue;const sc=cr*6-span+r();if(!top||sc>top.sc)top={sc,x,y,dx,dy};}}
      if(top)put(w,top.x,top.y,top.dx,top.dy);}
    if(!best||placed.length>best.placed.length)best={placed};
    if(placed.length>=target)break;
  }
  const P=best.placed,xs=P.flatMap(p=>[p.x,p.x+p.dx*(p.w.a.length-1)]),ys=P.flatMap(p=>[p.y,p.y+p.dy*(p.w.a.length-1)]);
  const x0=Math.min(...xs),y0=Math.min(...ys),W=Math.max(...xs)-x0+1,H=Math.max(...ys)-y0+1;
  const sol=Array.from({length:H},()=>Array(W).fill(null));
  const entries=P.map(p=>{const e={a:p.w.a,c:p.w.c,x:p.x-x0,y:p.y-y0,dx:p.dx,dy:p.dy};for(let i=0;i<e.a.length;i++)sol[e.y+e.dy*i][e.x+e.dx*i]=e.a[i];return e;});
  let num=0;const numAt={};for(let y=0;y<H;y++)for(let x=0;x<W;x++){const st=entries.filter(e=>e.x===x&&e.y===y);if(st.length){num++;numAt[x+","+y]=num;st.forEach(e=>e.n=num);}}
  entries.sort((a,b)=>(a.dx?0:1)-(b.dx?0:1)||a.n-b.n);
  return{W,H,sol,entries,numAt};
}
const sizeFor=l=>Math.min(16,6+Math.floor((l-1)/4));

/* ---------- Play ---------- */
let G=null,fill=[],cx=0,cy=0,dirA=true,mode=null,hints=0;
function begin(m,pack){mode={m,pack};
  if(m==="level")G=build("level"+S.level,sizeFor(S.level));
  if(m==="daily")G=build("daily"+today(),14);
  if(m==="pack"){G=build("pack"+pack+Date.now(),10,pack);}
  fill=G.sol.map(r=>r.map(c=>c?"":null));hints=0;const e=G.entries[0];cx=e.x;cy=e.y;dirA=!!e.dx;
  $("label").textContent=m==="level"?"Level "+S.level:m==="daily"?"Daily Challenge":PACKS.find(p=>p[0]===pack)[1];
  $("homeView").hidden=true;$("playView").hidden=false;$("clueList").hidden=true;$("note").hidden=true;document.body.classList.add("playing");drawGrid();scrollTo(0,0);}
function cur(){const on=e=>{const dx=cx-e.x,dy=cy-e.y;return e.dx?dy===0&&dx>=0&&dx<e.a.length:dx===0&&dy>=0&&dy<e.a.length;};return G.entries.find(e=>on(e)&&!!e.dx===dirA)||G.entries.find(on);}
function drawGrid(){const g=$("grid");g.style.gridTemplateColumns=`repeat(${G.W},1fr)`;const e=cur();dirA=!!e.dx;
  const inW=(x,y)=>e.dx?y===e.y&&x>=e.x&&x<e.x+e.a.length:x===e.x&&y>=e.y&&y<e.y+e.a.length;
  let h="";for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++){if(G.sol[y][x]===null){h+='<div class="cell void"></div>';continue;}
    const n=G.numAt[x+","+y];h+=`<button class="cell${x===cx&&y===cy?" cur":inW(x,y)?" word":""}" data-x="${x}" data-y="${y}" aria-label="Row ${y+1} column ${x+1}">${n?`<sup>${n}</sup>`:""}${fill[y][x]||""}</button>`;}
  g.innerHTML=h;$("clue").innerHTML=`<b>${e.n} ${e.dx?"Across":"Down"}</b> · ${e.c}`;$("coins").textContent="💰 "+S.coins;
  if(!$("clueList").hidden)drawList();}
function drawList(){const row=(e)=>{const done=[...e.a].every((_,i)=>fill[e.y+e.dy*i][e.x+e.dx*i]);return `<div class="${done?"done":""}" data-i="${G.entries.indexOf(e)}">${e.n}. ${e.c}</div>`;};
  $("clueList").innerHTML="<h4>Across</h4>"+G.entries.filter(e=>e.dx).map(row).join("")+"<h4 style='margin-top:10px'>Down</h4>"+G.entries.filter(e=>!e.dx).map(row).join("");}
const isCell=(x,y)=>G.sol[y]&&G.sol[y][x]!=null&&G.sol[y][x]!==undefined;
function advance(step){const e=cur(),i=(e.dx?cx-e.x:cy-e.y)+step;if(i>=0&&i<e.a.length){cx=e.x+e.dx*i;cy=e.y+e.dy*i;}}
function typeL(l){fill[cy][cx]=l;advance(1);drawGrid();checkDone();}
function back(){if(!fill[cy][cx])advance(-1);fill[cy][cx]="";drawGrid();}
function jump(d){const i=G.entries.indexOf(cur()),e=G.entries[(i+d+G.entries.length)%G.entries.length];cx=e.x;cy=e.y;dirA=!!e.dx;
  for(let k=0;k<e.a.length;k++){if(!fill[e.y+e.dy*k][e.x+e.dx*k]){cx=e.x+e.dx*k;cy=e.y+e.dy*k;break;}}drawGrid();}
function note(m){$("note").textContent=m;$("note").hidden=!m;}
function checkDone(){for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++)if(G.sol[y][x]&&!fill[y][x])return;
  let wrong=false;for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++)if(G.sol[y][x]&&fill[y][x]!==G.sol[y][x])wrong=true;
  if(wrong)note("The grid is full, but something is off. Tap Check grid to see which letters are wrong.");else win();}
function win(){note("");PY.celebrate();const base=mode.m==="daily"?60:mode.m==="pack"?15:15+G.entries.length;const bonus=hints?0:10;const gain=base+bonus;S.coins+=gain;
  const k=seasonKey();let pts=mode.m==="daily"?3:1;S.season[k]=(S.season[k]||0)+pts;const sn=seasonNow();let msg=[`+${gain} doubloons${bonus?" (no-hint bonus included)":""}.`];
  if(S.season[k]>=10&&!S.frames.includes(k)){S.frames.push(k);msg.push(`New ${sn} frame!`);}
  if(S.season[k]>=25&&!S.crowns.includes(k)){S.crowns.push(k);msg.push(`You earned the ${CROWNS[sn][1]}!`);}
  if(mode.m==="level"){if(S.level%5===0&&S.stamps<16){const fl=ALBUMS.flatMap(a=>a[1]);msg.push(`New stamp: ${fl[S.stamps][1]} ${fl[S.stamps][0]}`);S.stamps++;}S.level++;}
  if(mode.m==="daily"&&S.daily!==today()){S.daily=today();const q=SAYINGS[hash(today())%SAYINGS.length];if(!S.sayings.some(x=>x.q===q))S.sayings.unshift({q,d:today()});msg.push("New saying added to your collection.");}
  save();$("winT").textContent="☠ Solved!";$("winB").textContent=msg.join(" ");
  $("winNext").textContent=mode.m==="level"?"Level "+S.level:mode.m==="pack"?"Another voyage":"Next level";$("win").classList.add("open");}
function home(){G=null;document.body.classList.remove("playing");$("win").classList.remove("open");$("playView").hidden=true;$("homeView").hidden=false;drawHome();}

/* ---------- Home and collection ---------- */
let tab="Stamps";
function drawHome(){$("coins").textContent="💰 "+S.coins;const me=$("me");me.textContent=S.avatar;me.className="me"+(S.frameOn?" ring-"+S.frameOn:"");
  const toStamp=5-((S.level-1)%5);
  $("goNext").innerHTML=`<b>Play Level ${S.level}</b>${S.stamps<16?`${toStamp} more level${toStamp>1?"s":""} to a new stamp`:"Every stamp collected"}`;
  const done=S.daily===today();$("goDaily").innerHTML=done?`<b>Daily solved ✓</b>New puzzle in <span id="cd"></span>`:`<b>Daily Challenge</b>Solve it to collect a saying. Ends in <span id="cd"></span>`;tickCd();
  $("tabs").innerHTML=["Stamps","Avatars","Crowns","Frames","Sayings"].map(t=>`<button role="tab" aria-selected="${t===tab}" class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join("");
  const b=$("tabBody"),k=seasonKey(),sn=seasonNow(),pts=S.season[k]||0;
  if(tab==="Stamps"){let n=0;b.innerHTML=`<p style="color:var(--mute);margin:0">Collect a stamp every 5 levels. ${S.stamps} of 16 collected.</p><div class="album">`+ALBUMS.map(a=>`<h3>${a[0]}</h3><div class="stamps">`+a[1].map(s=>{const on=n++<S.stamps;return `<div class="stamp${on?"":" locked"}"><i>${s[0]}</i>${s[1]}</div>`;}).join("")+"</div>").join("")+"</div>";}
  if(tab==="Avatars")b.innerHTML=`<p style="color:var(--mute);margin:0 0 10px">Tap to wear one, or buy it with doubloons.</p><div class="avatars">`+AVATARS.map(a=>{const own=S.owned.includes(a[0]);return `<button data-av="${a[0]}" data-cost="${a[2]}" class="${S.avatar===a[0]?"on":""}"><i>${a[0]}</i>${a[1]}<br>${own?(S.avatar===a[0]?"Wearing":"Owned"):"💰 "+a[2]}</button>`;}).join("")+"</div>";
  const seas=(have,goal,label,icon)=>`<p style="margin:0;color:var(--mute)">${sn} season: ${pts} of ${goal} points. A puzzle is 1 point and the Daily is 3.</p><div class="meter"><span style="width:${Math.min(100,pts/goal*100)}%"></span></div><div class="seasons">`+["Fall","Winter","Spring","Summer"].map(s=>{const on=have.some(x=>x.startsWith(s));return `<div class="season ${s} ${on?"":"off"}" ${label==="Frames"&&on?`data-frame="${s}" style="cursor:pointer"`:""}><b>${s}</b><i>${on?icon(s):"🔒"}</i>${label==="Crowns"?CROWNS[s][1]:S.frameOn===s?"Wearing":s+" frame"}</div>`;}).join("")+"</div>";
  if(tab==="Crowns")b.innerHTML=seas(S.crowns,25,"Crowns",s=>CROWNS[s][0]);
  if(tab==="Frames")b.innerHTML=seas(S.frames,10,"Frames",()=>"⭕");
  if(tab==="Sayings")b.innerHTML=`<p style="color:var(--mute);margin:0">Pops and Pippy hand out one saying for each Daily Challenge you solve.</p>`+(S.sayings.length?S.sayings.map(s=>`<div class="saying">"${s.q}"<small>Collected ${s.d}</small></div>`).join(""):`<div class="saying">Your first saying is waiting in today's Daily Challenge.</div>`);
}
function tickCd(){const c=$("cd");if(!c)return;const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.floor((m-n)/1000);c.textContent=String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s/60)%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
setInterval(tickCd,1000);

/* ---------- Events ---------- */
$("goNext").onclick=()=>begin("level");$("goDaily").onclick=()=>begin("daily");$("quit").onclick=home;$("winHome").onclick=home;
$("winNext").onclick=()=>{$("win").classList.remove("open");if(mode.m==="pack")begin("pack",mode.pack);else begin("level");};
$("packs").innerHTML=PACKS.map(p=>`<button data-p="${p[0]}">${p[1]}</button>`).join("");
$("packs").onclick=e=>{const p=e.target.dataset.p;if(p)begin("pack",p);};
$("tabs").onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;drawHome();}};
$("tabBody").onclick=e=>{const f=e.target.closest("[data-frame]");if(f){S.frameOn=S.frameOn===f.dataset.frame?null:f.dataset.frame;save();drawHome();return;}
  const a=e.target.closest("[data-av]");if(!a)return;const v=a.dataset.av,c=+a.dataset.cost;if(!S.owned.includes(v)){if(S.coins<c)return;S.coins-=c;S.owned.push(v);}S.avatar=v;save();drawHome();};
$("grid").onclick=e=>{const b=e.target.closest("[data-x]");if(!b)return;const x=+b.dataset.x,y=+b.dataset.y;if(x===cx&&y===cy)dirA=!dirA;cx=x;cy=y;drawGrid();};
$("prev").onclick=()=>jump(-1);$("nxt").onclick=()=>jump(1);
$("kb").innerHTML=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM⌫"].map(r=>"<div>"+[...r].map(k=>`<button data-k="${k}" class="${k==="⌫"?"wide":""}" aria-label="${k==="⌫"?"Delete":k}">${k}</button>`).join("")+"</div>").join("");
$("kb").onclick=e=>{const k=e.target.dataset.k;if(!k||!G)return;k==="⌫"?back():typeL(k);};
addEventListener("keydown",e=>{if(!G||$("win").classList.contains("open"))return;if(/^[a-zA-Z]$/.test(e.key)&&!e.metaKey&&!e.ctrlKey){typeL(e.key.toUpperCase());e.preventDefault();}
  else if(e.key==="Backspace"){back();e.preventDefault();}else if(e.key==="Tab"){jump(e.shiftKey?-1:1);e.preventDefault();}
  else{const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(d){const nx=cx+d[0],ny=cy+d[1];if(isCell(nx,ny)){cx=nx;cy=ny;dirA=!!d[0];drawGrid();}e.preventDefault();}}});
function pay(c){if(S.coins<c){note("You need "+c+" doubloons for that. Solve more puzzles to earn them.");return false;}S.coins-=c;hints++;save();return true;}
$("hLetter").onclick=()=>{if(!pay(25))return;fill[cy][cx]=G.sol[cy][cx];note("");advance(1);drawGrid();checkDone();};
$("hWord").onclick=()=>{if(!pay(80))return;const e=cur();for(let i=0;i<e.a.length;i++)fill[e.y+e.dy*i][e.x+e.dx*i]=e.a[i];note("");drawGrid();checkDone();};
$("hCheck").onclick=()=>{let bad=0;document.querySelectorAll("#grid [data-x]").forEach(b=>{const x=+b.dataset.x,y=+b.dataset.y;if(fill[y][x]&&fill[y][x]!==G.sol[y][x]){b.classList.add("bad");bad++;}});note(bad?bad+" letter"+(bad>1?"s are":" is")+" wrong. They're marked in red.":"No wrong letters so far.");};
$("hList").onclick=()=>{const l=$("clueList");l.hidden=!l.hidden;if(!l.hidden)drawList();};
$("clueList").onclick=e=>{const d=e.target.closest("[data-i]");if(!d)return;const en=G.entries[+d.dataset.i];cx=en.x;cy=en.y;dirA=!!en.dx;drawGrid();scrollTo(0,0);};
drawHome();
</script>
</body></html>
