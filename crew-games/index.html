<!DOCTYPE html>
<html lang="en">
<head><script src="../assets/poy-config.js"></script><script src="../assets/poy.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crew Games</title>
<link rel="icon" href="../assets/watermark.png">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya:wght@400;700&family=Alegreya+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120b2e;--panel:#21174e;--line:#463a80;--ink:#fbf1da;--mute:#c3bbdc;--gold:#ffc94d;--rum:#f76f3e;--pink:#ea4a55;--sea:#4fd1c0;--dark:#1b1305;
--display:"Pirata One",Georgia,serif;--body:Alegreya,Georgia,serif;--ui:"Alegreya Sans",system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120b2e}}
:root[data-theme="dark"]{--bg:#120b2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 var(--body)}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;min-height:44px;border:0;border-radius:10px;padding:10px 16px;touch-action:manipulation}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:22px 16px calc(32px + env(safe-area-inset-bottom,0px))}
h1{font-size:clamp(2.6rem,9vw,4rem);color:var(--gold);line-height:1}
.sub{color:var(--mute);margin:6px 0 16px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.tabs button{background:var(--panel);color:var(--ink);border:1px solid var(--line);font:700 .92rem/1.2 var(--ui);padding:8px 6px}
.tabs button[aria-selected="true"]{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:440px}
.stage h2{font-size:2.1rem;color:var(--gold);line-height:1.05;margin-bottom:6px}
.go{background:var(--rum);color:#fff;font-weight:700;font-size:1.05rem}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.hud{display:flex;justify-content:space-between;gap:10px;font:700 .95rem var(--ui);margin-bottom:10px;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{font:400 2rem var(--display);color:var(--sea)}

/* Eric */
.book{background:radial-gradient(circle at 50% 0,#4a3216,#160d05 75%);border-radius:10px;padding:18px;min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center}
.line{font-size:clamp(1.25rem,4.4vw,1.6rem);line-height:1.45;margin:0;color:#f5e3bd}
.line span{opacity:0;transition:opacity .45s}.line span.on{opacity:1}
.calmrow{display:flex;align-items:center;gap:18px;margin-top:16px}
.candle{position:relative;width:76px;height:76px;flex:none}
.ring{position:absolute;inset:0;border-radius:50%;background:var(--gold);transform:scale(.25);opacity:.55}
.ring.ready{background:var(--sea);opacity:.9}
.flame{position:absolute;inset:0;display:grid;place-items:center;font-size:30px}

/* Emily */
.bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stool{min-height:128px;background:#160f38;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);text-align:center}
.stool .face{font-size:36px;line-height:1.1}
.stool small{font:600 .78rem/1.2 var(--ui);min-height:2.4em;margin-top:3px}
.stool.bad{border-color:var(--pink)}
.stool.hit{background:var(--sea);color:#06231f}.stool.oops{background:var(--pink);color:#fff}

/* No Drama */
canvas{display:block;width:100%;max-width:420px;margin:0 auto;border-radius:10px;background:#0e2a44;touch-action:none}
.meter{height:12px;background:#160f38;border-radius:99px;overflow:hidden;margin-bottom:10px}.meter i{display:block;height:100%;background:var(--sea);width:100%}
.picks{display:grid;gap:8px;margin-top:12px}
.picks button{background:#160f38;color:var(--ink);border:1px solid var(--line);text-align:left}
.picks b{color:var(--gold)}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;margin:10px auto 0}
.pad button{background:var(--gold);color:var(--dark);font-weight:700;min-height:56px}

/* Boucher */
.boss{display:flex;gap:14px;align-items:center;margin-bottom:10px}.boss img{width:92px;height:auto;border-radius:50%;flex:none}.boss p{margin:4px 0 0}
.pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:420px;margin:10px auto 0}
.pads button{min-height:72px;font-weight:700;color:#120b2e;touch-action:none;user-select:none}.pads button:nth-child(1){background:#4fd1c0}.pads button:nth-child(2){background:#ffc94d}.pads button:nth-child(3){background:#f76f3e}
/* Ashlee */
.gal{background:#160f38 url(../assets/art/waldo-painting.jpg) center/cover;border-radius:10px;padding:10px;box-shadow:inset 0 0 0 4px #7a5a26,0 8px 24px #0007}
.galin{background:#120b2ed9;border-radius:8px;padding:16px}
.xw{display:grid;gap:1px;max-width:560px;margin:0 auto}
.xw .blank{aspect-ratio:1}
.cell{position:relative;aspect-ratio:1;background:#fff8e6f2;box-shadow:0 0 0 1px #2b1d0e}
.cell input{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;text-align:center;font:700 clamp(.8rem,3.6vw,1.2rem) var(--ui);color:#1b1305;padding:6% 0 0;text-transform:uppercase;caret-color:transparent;border-radius:0;outline:none}
.cell small{position:absolute;left:2px;top:0;font:700 8px/1.2 var(--ui);color:#5a3720;z-index:1;pointer-events:none}
.cell.on{background:#ffe29a}.cell.cur{background:#ffc94d}.cell.bad{background:#f7a6a0}.cell.good input{color:#0c6b5c}
.xw.solved .cell{background:#fff8e6b0}
.now{min-height:2.8em;font:700 1rem/1.35 var(--ui);margin:10px 0 0;color:var(--gold)}
.clues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.clues h3{font:400 1.4rem var(--display);color:var(--gold);margin:0 0 4px}
.clues ol{margin:0;padding-left:24px;font:500 .9rem/1.35 var(--ui)}.clues li{padding:4px 2px;cursor:pointer;border-radius:4px}.clues li.on{background:#ffc94d33}
.fine{font:500 .82rem/1.4 var(--ui);color:var(--mute);margin:8px 0 0}
/* Tabby */
.sheet{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;margin-bottom:8px;max-width:420px;margin-inline:auto}.sheet i{font:700 .72rem/2 var(--ui);font-style:normal;text-align:center;background:#160f38;border:1px solid var(--line);min-height:24px;overflow:hidden;white-space:nowrap}
.stations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.stations button{min-height:110px;font-size:42px;background:#160f38;border:1px solid var(--line);opacity:.45}.stations button.lit{background:var(--gold);opacity:1}
.stage canvas{max-width:360px}
@media (max-width:520px){.clues{grid-template-columns:minmax(0,1fr)}}
#poy-sound-widget{display:none!important}
.txt{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:#160f38;color:var(--ink);font:inherit;padding:0 12px;margin-top:4px}.field{font:700 .95rem var(--ui)}
.decks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dk{min-height:96px;font-weight:700;color:#120b2e;touch-action:none;user-select:none;filter:saturate(.55) brightness(.75);transition:filter .08s,transform .08s}.dk.lit{filter:none;transform:scale(1.04);box-shadow:0 0 24px #fff8}
.k0{background:#4fd1c0}.k1{background:#ffc94d}.k2{background:#e77fd0}.k3{background:#f76f3e}
.floor{font:400 1.4rem var(--display);color:var(--gold);margin:16px 0 6px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font:700 .85rem var(--ui);background:#160f38;border:1px solid var(--line);border-radius:99px;padding:5px 11px}.chip.me{background:var(--gold);color:var(--dark)}.chip.new{border-color:var(--sea);color:var(--sea)}
.chests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.chests button{min-height:110px;font-size:46px;background:#160f38;border:1px solid var(--gold)}
.mc{font:700 1rem/1.35 var(--ui);color:var(--sea);margin:0 0 12px;min-height:2.7em}
.love{display:flex;justify-content:center;gap:14px;align-items:center;padding:30px 0 10px}.love .big{font-size:60px}.love .hrt{font-size:44px}
.run{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;margin:10px auto 0}.run button{min-height:74px;font-weight:700;background:#46386f;color:var(--ink);touch-action:none;user-select:none}.run button.now{background:var(--gold);color:var(--dark)}.run #J{grid-column:1/3;background:var(--sea);color:#06231f;min-height:54px}
footer{margin-top:28px;font:500 .88rem/1.6 var(--ui);color:var(--mute)}footer a{color:var(--gold)}
body .pp-wm{position:absolute;right:14px;top:60px;bottom:auto;animation:none;z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.72;filter:drop-shadow(0 0 9px rgba(255,214,120,.65))}
.pp-wm img{width:64px;aspect-ratio:1;object-fit:cover;object-position:50% 52%;border-radius:50%;border:2px solid var(--gold)}
.pp-wm span{font:600 9.5px/1.2 var(--ui);color:#fff;text-shadow:0 1px 3px #000;text-align:center;max-width:140px}
</style>
</head>
<body>
<main>
<h1>Crew Games</h1>
<p class="sub">Nine games, made for the crew.</p>
<div class="tabs" role="tablist">
  <button role="tab" id="t-eric" type="button">Eric's Quiet Hour</button>
  <button role="tab" id="t-emily" type="button">Emily vs. Bad Customers</button>
  <button role="tab" id="t-nodrama" type="button">No Drama Deck</button>
  <button role="tab" id="t-boucher" type="button">DJ Boucher</button>
  <button role="tab" id="t-ashley" type="button">Ashlee Rae's Crosswords</button>
  <button role="tab" id="t-tabby" type="button">Tabby's Lanes</button>
  <button role="tab" id="t-altar" type="button">Race to the Altar</button>
  <button role="tab" id="t-spinoff" type="button" style="grid-column:2/-1">Boucher &amp; Lita's Spin-Off</button>
  <button role="tab" id="t-tire" type="button" style="grid-column:1/-1">Ashlee Rae's Tire Toss</button>
</div>
<p class="mc" id="mc" aria-live="polite"></p>
<div class="stage" id="stage" role="tabpanel"></div>
<div class="row"><button class="ghost" id="snd" type="button" aria-pressed="true">Sound on</button><button class="ghost" id="mcb" type="button" aria-pressed="true">Announcer on</button></div>
<footer>© 2026 Adam Kornreich / R.A. Consulting ❤ Pops &amp; Pippy. All rights reserved.<br>
<a href="../privacy/index.html">Privacy</a> · <a href="../support/index.html">Support</a> · <a href="../no-endorsement/index.html">No Endorsement</a></footer>
</main>
<div class="pp-wm" aria-hidden="true"><img src="../assets/poster.jpg" alt=""></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)},stage=$("stage"),run=0,timers=[];
function later(f,ms){var r=run,t=setTimeout(function(){if(r===run)f()},ms);timers.push(t);return t}
function stop(){run++;timers.forEach(clearTimeout);timers=[];document.onkeydown=null}
function best(k,v){try{var o=+localStorage.getItem(k)||0;if(v>o){localStorage.setItem(k,v);return v}return o}catch(e){return v}}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

/* ---------- sound, all synthesized ---------- */
var ac=null,on=true;
function ctx(){if(!on)return null;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}catch(e){return null}}
function noise(dur,freq,vol,type,rise){var c=ctx();if(!c)return;var n=c.sampleRate*dur|0,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
var s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime;s.buffer=b;f.type=type||"lowpass";f.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(rise||.02));g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(c.destination);s.start()}
function tone(f1,f2,dur,vol,type,at){var c=ctx();if(!c)return;var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(at||0);o.type=type||"sine";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur)}
var FX={waves:function(){noise(3.4,600,.22,"lowpass",1.4)},creak:function(){tone(90,150,.9,.1,"sawtooth");tone(150,80,.8,.07,"sawtooth",.9)},thunder:function(){noise(3,180,.6,"lowpass",.08);tone(60,35,1.8,.3)},heart:function(){[0,.28,1.1,1.38].forEach(function(a){tone(70,40,.2,.5,"sine",a)})},door:function(){tone(120,70,1,.12,"sawtooth");noise(.3,300,.4,"lowpass",.01)},wind:function(){noise(3.2,1100,.14,"bandpass",1.3)},clink:function(){tone(1900,1700,.4,.12,"triangle");tone(2600,2400,.3,.08,"triangle",.1)},splash:function(){noise(1.2,1800,.3,"lowpass",.02)},bell:function(){tone(660,655,2.2,.22);tone(1320,1310,1.4,.08)},page:function(){noise(.28,2400,.13,"highpass",.04)}};

/* ---------- Eric's Quiet Hour ---------- */
var STORY=[
["The tide went out at midnight, and it did not come back.","waves"],
["Old timbers groaned below the deck, one slow breath at a time.","creak"],
["Somewhere in the hold, something knocked. Once.","door"],
["The captain closed his eyes, and listened to his own heart.","heart"],
["The wind came up with no sail to fill.","wind"],
["Far off, the sky cleared its throat.","thunder"],
["A single coin rolled the length of the table, and stopped.","clink"],
["Nobody had touched it.","heart"],
["He turned the lantern down. He did not run. He read on.","page"],
["Then the water, all at once, came home.","splash"],
["And the ship rose, gently, as if nothing had happened.","waves"],
["The bell rang one time. The hour was over.","bell"]];
function eric(){var r=run,i=0,calm=0,tries=0,ready=false,p=0;
 function intro(){stage.innerHTML='<h2>Eric\'s Quiet Hour</h2><p>Eric reads. The tale is intense, and the reader never hurries. Let each line appear, then turn the page only when the candle ring glows green. Rush it and the flame shakes. Sound on is best.</p><button class="go" id="b" type="button">Open the book</button>';$("b").onclick=function(){ctx();draw()}}
 function draw(){stage.innerHTML='<div class="hud"><span>Page '+(i+1)+' of '+STORY.length+'</span><span>Calm '+calm+'</span></div><div class="book"><p class="line" id="l" aria-live="polite"></p></div><div class="calmrow"><div class="candle"><div class="ring" id="r"></div><div class="flame" id="f">🕯️</div></div><button class="go" id="t" type="button" style="flex:1">Turn the page</button></div>';
  var w=STORY[i][0].split(" ");$("l").innerHTML=w.map(function(x){return "<span>"+x+" </span>"}).join("");
  var sp=$("l").children;tries=0;ready=false;FX[STORY[i][1]]();
  w.forEach(function(_,k){later(function(){sp[k].className="on"},350+k*340)});
  var start=performance.now()+350+w.length*340;
  (function tick(){if(r!==run||!$("r"))return;var now=performance.now();if(now>=start){p=(1-Math.cos((now-start)/4200*2*Math.PI))/2;ready=p>.8}else{p=0;ready=false}
   var e=$("r");e.style.transform="scale("+(.25+p*.75)+")";e.className=ready?"ring ready":"ring";requestAnimationFrame(tick)})();
  $("t").onclick=function(){if(ready){if(tries===0)calm++;FX.page();i++;if(i>=STORY.length)end();else draw()}else{tries++;tone(220,180,.15,.06,"triangle");var f=$("f");f.textContent="💨";later(function(){if($("f"))f.textContent="🕯️"},700)}};
 }
 function end(){var b=best("poy-eric",calm),t=calm>=11?"Unshakable":calm>=8?"Steady Hand":calm>=4?"Still Waters":"Keep Breathing";
  stage.innerHTML='<h2>The End</h2><p class="tag">'+t+'</p><p>'+calm+' of '+STORY.length+' pages turned on the first calm try. Best: '+b+'.</p><button class="go" id="b" type="button">Read it again</button>';$("b").onclick=function(){eric()}}
 intro()}

/* ---------- Emily vs. Bad Customers ---------- */
var BAD=[["😤","I know the owner."],["🫰","Hey. HEY. You."],["🧾","I'll pay next week."],["😠","I want your manager."],["🍽️","I ate it all. It was awful."],["📱","One star. Watch me."],["🥴","Do you know who I am?"],["🙄","It was cheaper last time."]];
var GOOD=[["😊","Thanks, Emily!"],["🥰","Keep the change."],["😄","You're the best."],["🙂","No rush at all."]];
function emily(){var r=run,score=0,hearts=3,left=60,seats=[];
 function intro(){stage.innerHTML='<h2>Emily vs. Bad Customers</h2><p>Emily has had enough. Tap the bad customers to send them down the plank before they complain. Leave the good ones alone. You know who you are.</p><button class="go" id="b" type="button">Start the shift</button>';$("b").onclick=function(){ctx();start()}}
 function hud(){$("h").textContent="❤️".repeat(Math.max(hearts,0));$("s").textContent="Bounced "+score;$("c").textContent=left+"s"}
 function start(){playBeat("east");stage.innerHTML='<div class="hud"><span id="h"></span><span id="c"></span><span id="s"></span></div><div class="bar" id="bar"></div>';
  for(var k=0;k<6;k++){(function(k){var b=document.createElement("button");b.type="button";b.className="stool";b.setAttribute("aria-label","Empty stool");b.innerHTML='<span class="face">🪑</span><small></small>';b.onclick=function(){tap(k)};$("bar").appendChild(b);seats[k]={el:b,who:null}})(k)}
  hud();(function clock(){later(function(){left--;hud();if(left<=0)return end();clock()},1000)})();spawn()}
 function clear(k){var s=seats[k];s.who=null;clearTimeout(s.t);s.el.className="stool";s.el.setAttribute("aria-label","Empty stool");s.el.innerHTML='<span class="face">🪑</span><small></small>'}
 function spawn(){var free=seats.map(function(s,i){return s.who?-1:i}).filter(function(i){return i>=0});
  if(free.length){var k=pick(free),bad=Math.random()<.7,w=pick(bad?BAD:GOOD),s=seats[k],stay=Math.max(1500,3200-(60-left)*28);s.who=bad?"bad":"good";s.el.className="stool"+(bad?" bad":"");s.el.setAttribute("aria-label",(bad?"Bad customer: ":"Good customer: ")+w[1]);s.el.innerHTML='<span class="face">'+w[0]+'</span><small>'+w[1]+'</small>';if(bad)tone(300,240,.12,.06,"square");
   s.t=later(function(){if(s.who==="bad"){hearts--;tone(160,90,.4,.14,"sawtooth");flash(k,"oops","Complaint!");if(hearts<=0)return end();hud()}else clear(k)},stay)}
  later(spawn,Math.max(420,950-(60-left)*9))}
 function flash(k,c,t){var s=seats[k];clearTimeout(s.t);s.who="x";s.el.className="stool "+c;s.el.innerHTML='<span class="face">'+(c==="hit"?"🏴‍☠️":"💥")+'</span><small>'+t+'</small>';later(function(){clear(k)},380)}
 function tap(k){var s=seats[k];if(s.who==="bad"){score++;noise(.25,1500,.25,"lowpass",.01);tone(500,120,.3,.1,"triangle");flash(k,"hit","Off the plank!");hud()}else if(s.who==="good"){hearts--;tone(160,90,.4,.14,"sawtooth");flash(k,"oops","Not them!");if(hearts<=0)return end();hud()}}
 function end(){seats.forEach(function(s){clearTimeout(s.t)});stop();var b=best("poy-emily",score),t=score>=40?"Queen of the Floor":score>=20?"Shift Legend":score>=8?"Holding the Line":"Rough Night";
  stage.innerHTML='<h2>Shift over</h2><p class="tag">'+t+'</p><p>'+score+' bad customers bounced. Best: '+b+'.</p><button class="go" id="b" type="button">Work another shift</button>';$("b").onclick=function(){stop();emily()}}
 intro()}

/* ---------- No Drama Deck ---------- */
var CREW={Lorenz:["🧭","Steady. Momentum drains slower."],Doug:["⚓","Upbeat. Good vibes count double."],Vanessa:["🌟","Unbothered. Shrugs off drama every 12 seconds."]};
var DRAMA=["Gossip","He said","She said","Reply all","Who did it?","Whatever","Group chat","Let's talk"];
function nodrama(){
 function intro(){stage.innerHTML='<h2>No Drama Deck</h2><p>Keep moving. Stay positive. Catch the good vibes, dodge the drama. Stand still in one lane too long and your momentum drains faster. Pick your crew:</p><div class="picks" id="p"></div>';
  Object.keys(CREW).forEach(function(n){var b=document.createElement("button");b.type="button";b.innerHTML="<b>"+CREW[n][0]+" "+n+"</b> · "+CREW[n][1];b.onclick=function(){ctx();start(n)};$("p").appendChild(b)})}
 function start(name){playBeat("west");var r=run,W=420,H=520,lane=1,x=lane,items=[],mo=100,dist=0,last=performance.now(),sp=170,moved=last,next=0,shieldAt=0,msg="",msgT=0;
  stage.innerHTML='<div class="hud"><span>'+CREW[name][0]+" "+name+'</span><span id="d">0 m</span></div><div class="meter"><i id="m"></i></div><canvas id="cv" width="'+W+'" height="'+H+'" aria-label="Three lanes. Move left and right to catch stars and dodge drama."></canvas><div class="pad"><button id="L" type="button">◀ Left</button><button id="R" type="button">Right ▶</button></div>';
